# MeritFlow on Render — free tier.
#
# Apply with Blueprints: New → Blueprint, pointed at this repository. Everything
# below is created and wired automatically except the values marked
# `sync: false`, which Render prompts for once.
#
# ── Shaped for free instances, and what that costs ───────────────────────────
#
# Both services are `web` and both are free, which has three consequences worth
# knowing before you deploy rather than after:
#
#   1. Free services sleep when idle and take roughly a minute to wake. The
#      first course generation after a quiet period will look like a hang.
#   2. Free instances have 512 MB. That is enough for the generator and not
#      enough for the generator plus Chroma, so semantic search is switched off
#      here (VECTOR_SEARCH_DISABLED) and the slimmer requirements file is used.
#      The application treats an unavailable vector store as normal and reads
#      lessons directly, so this costs in-course search speed and nothing else.
#   3. The generator is a PUBLIC web service, because private services are not
#      part of the free tier. It has no user accounts and spends the operator's
#      Anthropic credit, so BACKEND_SHARED_SECRET is not optional here — it is
#      the only thing standing between the internet and your API bill.
#
# To move to paid later: set `plan: starter` on both, change the backend to
# `type: pserv`, drop VECTOR_SEARCH_DISABLED, and point its buildCommand back at
# requirements.txt.

databases:
  - name: courseai-db
    databaseName: courseai
    user: courseai
    # Free Postgres expires and has no backups. Move to a paid instance before
    # this holds anything you would mind losing.
    plan: free

services:
  # ── The Python generator ───────────────────────────────────────────────────
  - type: web
    name: courseai-backend
    runtime: python
    plan: free
    rootDir: backend
    # The slim requirements: no chromadb, so no onnxruntime and no embedding
    # model competing for 512 MB.
    buildCommand: pip install -r requirements-lite.txt
    # One worker. Generation is long and mostly spent waiting on the model, so a
    # second worker competes for memory rather than adding throughput — and on
    # a free instance memory is the binding constraint.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Not optional on this plan: the service is publicly reachable, and this
      # is what rejects everything that is not the web app. Render generates it
      # once and copies it to the web service below.
      - key: BACKEND_SHARED_SECRET
        generateValue: true

      # See the note at the top. Without this, the first /health request imports
      # the whole Chroma stack to answer a question about it.
      - key: VECTOR_SEARCH_DISABLED
        value: "1"

      # The operator's fallback key. A user who saves their own in Settings
      # overrides it per request; without it, only those users can generate.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Haiku on the free tier: it is the fastest and cheapest, which matters
      # most where the instance sleeps and the clock is already against you.
      - key: COURSE_MODEL
        value: claude-haiku-4-5-20251001

  # ── The Next.js app ────────────────────────────────────────────────────────
  - type: web
    name: courseai-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"

      # Supplied by the database above; never set by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: courseai-db
          property: connectionString

      # The backend's address. Rendered as `host:port` with no scheme, which is
      # why the application normalises it in src/lib/backend-url.ts rather than
      # assuming a URL.
      - key: PYTHON_BACKEND_URL
        fromService:
          type: web
          name: courseai-backend
          property: hostport

      # The same generated value the backend holds, so the two agree without
      # anyone copying a secret by hand.
      - key: BACKEND_SHARED_SECRET
        fromService:
          type: web
          name: courseai-backend
          envVarKey: BACKEND_SHARED_SECRET

      # Unwraps the API keys users save in Settings.
      #
      # This MUST be set and MUST NOT change. Without it the app generates a key
      # file at runtime, that file dies with the container, and every key any
      # user saved becomes permanently unreadable — silently, on the next
      # deploy. Generated once by Render and then left alone.
      - key: CREDENTIAL_SECRET
        generateValue: true

      # The operator's fallback key, same as the backend's. Set both.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Optional. Video lookups prefer YouTube and fall back to SerpAPI; cover
      # art is SerpAPI only. With neither, courses arrive without videos or
      # covers — degraded, not broken.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
